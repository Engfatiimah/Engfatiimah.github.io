<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fatimah Bin Mohammed — Portfolio</title>
<meta name="description" content="IT student at King Saud University, Flutter developer and UI/UX designer. Projects, achievements, and certificates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F1E8; --bg-2:#EFE8DB; --surface:#FFFCF6; --tint:#E2EEEA; --ink:#132C29; --muted:#5A6B67; --line:#DDD4C4;
  --teal:#0E4B48; --teal-2:#1D6E68; --teal-3:#2F8F86; --terra:#C25E36; --terra-2:#E08157; --terra-soft:#F4DDD0; --on-teal:#F6F1E8;
  --glass:rgba(255,252,246,.74); --shadow:0 1px 2px rgba(14,75,72,.06),0 14px 34px -18px rgba(14,75,72,.32);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0B1615; --bg-2:#0F1D1C; --surface:#12211F; --tint:#163230; --ink:#EEE7DB; --muted:#98ABA6; --line:#223B38;
  --teal:#58B2A6; --teal-2:#79C6BA; --teal-3:#9ED8CD; --terra:#E68A60; --terra-2:#F2A57F; --terra-soft:#3A2419; --on-teal:#0B1615;
  --glass:rgba(18,33,31,.74); --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.7);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0B1615; --bg-2:#0F1D1C; --surface:#12211F; --tint:#163230; --ink:#EEE7DB; --muted:#98ABA6; --line:#223B38;
  --teal:#58B2A6; --teal-2:#79C6BA; --teal-3:#9ED8CD; --terra:#E68A60; --terra-2:#F2A57F; --terra-soft:#3A2419; --on-teal:#0B1615;
  --glass:rgba(18,33,31,.74); --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.7);}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background .5s,color .5s}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
::selection{background:var(--terra);color:#fff}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px;border-radius:8px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* intro */
.curtain{position:fixed;inset:0;z-index:100;background:var(--teal);display:grid;place-items:center;pointer-events:none;clip-path:inset(0 0 0 0);animation:curtain 1s var(--ease) .5s forwards}
.curtain span{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,64px);color:var(--on-teal);animation:cword .8s var(--ease) forwards}
.curtain i{position:absolute;bottom:0;inset-inline:0;height:3px;background:var(--terra);transform-origin:left;animation:cbar .55s var(--ease) forwards}
@keyframes curtain{to{clip-path:inset(0 0 100% 0)}}
@keyframes cword{0%{opacity:0;transform:translateY(24px)}45%{opacity:1;transform:none}100%{opacity:1}}
@keyframes cbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:90;background:linear-gradient(90deg,var(--teal),var(--terra));transform-origin:0 50%;transform:scaleX(0)}
[dir="rtl"] .progress{transform-origin:100% 50%}
.cur,.cur-ring{position:fixed;top:0;left:0;z-index:95;pointer-events:none;border-radius:50%;opacity:0;transition:opacity .3s}
.cur{width:7px;height:7px;background:var(--terra);margin:-3.5px 0 0 -3.5px}
.cur-ring{width:32px;height:32px;border:1.5px solid var(--teal);margin:-16px 0 0 -16px;transition:width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease),background .3s,opacity .3s}
.cur-ring.big{width:54px;height:54px;margin:-27px 0 0 -27px;background:color-mix(in srgb,var(--terra) 14%,transparent);border-color:var(--terra)}
@media (pointer:fine){body.has-cur .cur,body.has-cur .cur-ring{opacity:1}}

/* nav */
.nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline:0;z-index:50;display:flex;justify-content:center;padding-inline:12px;transition:transform .4s var(--ease)}
.nav.hide{transform:translateY(-130%)}
.navin{display:flex;align-items:center;gap:4px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow);max-width:100%}
.logo{width:34px;height:34px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;text-decoration:none;flex:none;transition:transform .5s var(--spring)}
.logo:hover{transform:rotate(-12deg) scale(1.08)}
.navlinks{position:relative;display:flex;gap:1px}
.navlinks a{position:relative;z-index:1;text-decoration:none;font-size:13px;padding:7px 12px;border-radius:999px;color:var(--muted);transition:color .3s;white-space:nowrap}
.navlinks a.on{color:var(--on-teal)}
.navpill{position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:var(--teal);transition:transform .45s var(--ease),width .45s var(--ease),opacity .3s;opacity:0}
.ibtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .3s var(--spring),border-color .3s}
.ibtn:hover{transform:scale(1.08);border-color:var(--terra)}
.ibtn.txt{width:auto;padding-inline:11px;border-radius:999px;font-family:var(--f-mono);font-size:12px}
@media (max-width:860px){.navlinks{display:none}}

/* hero */
.hero{position:relative;padding-block:104px 56px;overflow:hidden}
#dots{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;z-index:0;animation:float 18s ease-in-out infinite alternate}
.blob.a{width:360px;height:360px;background:var(--teal-3);top:-110px;inset-inline-end:-70px}
.blob.b{width:300px;height:300px;background:var(--terra-2);bottom:-140px;inset-inline-start:-90px;animation-delay:-6s;opacity:.28}
@keyframes float{to{transform:translate(40px,30px) scale(1.12)}}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1fr;gap:36px;align-items:center}
.hero .wrap>div{max-width:760px}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.hero{padding-block:90px 36px}}
.status{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);padding:5px 13px 5px 9px;border-radius:999px}
.pulse{width:8px;height:8px;border-radius:50%;background:#2FB380;position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:#2FB380;animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(3);opacity:0}}
.hero h1{font-size:clamp(36px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-block:0 6px;line-height:1.08}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.22em;margin-bottom:-.14em}
.hero h1 .w>span{display:inline-block;transform:translateY(110%);animation:rise .9s var(--ease) forwards}
@keyframes rise{to{transform:none}}
.hero h1 .accent{color:var(--teal)}
.htitle{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em;margin-bottom:12px}
.rot{font-family:var(--f-display);font-size:clamp(18px,2.2vw,24px);font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:1.5em}
.rot .lbl{color:var(--muted);font-weight:400}
.rotbox{position:relative;display:inline-grid;overflow:hidden;height:1.9em;line-height:1.9em;color:var(--terra)}
.rotbox span{grid-area:1/1;transition:transform .6s var(--ease),opacity .6s;white-space:nowrap}
.rotbox span.out{transform:translateY(-100%);opacity:0}
.rotbox span.wait{transform:translateY(100%);opacity:0}
.hero .lead{font-size:16px;color:var(--muted);max-width:50ch;margin-top:12px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;padding:11px 18px;border-radius:12px;border:1px solid transparent;cursor:pointer;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s,color .3s,background .3s;isolation:isolate;background:transparent}
.btn.primary{background:var(--teal);color:var(--on-teal);box-shadow:0 10px 22px -12px var(--teal)}
.btn.primary::before{content:"";position:absolute;inset:0;background:var(--terra);z-index:-1;transform:scaleY(0);transform-origin:bottom;transition:transform .45s var(--ease)}
.btn.primary:hover::before{transform:scaleY(1)}
.btn.outline{border-color:var(--terra);color:var(--terra)}
.btn.outline:hover{background:var(--terra);color:#fff}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover{border-color:var(--teal)}
.btn .arr{transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
[dir="rtl"] .btn .arr{transform:scaleX(-1)}
[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(4px)}

/* phone */
.stage{display:grid;justify-items:center;gap:14px;perspective:1200px}
.phone{width:min(240px,70vw);aspect-ratio:9/18.5;border-radius:38px;background:#0A1312;padding:9px;box-shadow:0 34px 70px -30px rgba(14,75,72,.55),0 0 0 1px rgba(255,255,255,.06) inset;transform:rotateY(var(--ry,-8deg)) rotateX(var(--rx,4deg));transition:transform .5s var(--ease);position:relative;max-width:100%}
.phone::before{content:"";position:absolute;top:15px;left:50%;width:70px;height:20px;margin-left:-35px;border-radius:12px;background:#000;z-index:5}
.screens{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;direction:ltr;text-align:left}
.scr{position:absolute;inset:0;padding:30px 0 0;cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:transform .7s var(--ease),opacity .7s var(--ease);opacity:0;transform:translateX(100%) scale(.96);color:#E8ECFF;font-family:"Readex Pro",sans-serif;background:radial-gradient(circle at 70% 10%,var(--bg1),#0B0F26 62%)}
.scr.on{opacity:1;transform:none}
.scr.prev{opacity:0;transform:translateX(-40%) scale(.92)}
.scr img{display:block;width:100%;flex:1;min-height:0;object-fit:cover;object-position:top}
.scr.on img{animation:scrin 5.2s ease-out both}
@keyframes scrin{from{transform:scale(1.06)}to{transform:none}}
.scr .open{position:absolute;bottom:12px;left:50%;transform:translateX(-50%) translateY(8px);font-family:var(--f-body);font-size:11px;font-weight:600;background:rgba(14,75,72,.92);color:#fff;padding:5px 12px;border-radius:999px;opacity:0;transition:all .35s var(--ease);white-space:nowrap}
.phone:hover .scr.on .open{opacity:1;transform:translateX(-50%)}
.scr .st{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#cfd8ff,transparent),radial-gradient(1px 1px at 85% 20%,#fff,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent);opacity:.8}
.scr .hd{position:relative;display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;margin-top:2px;line-height:1.3}
.scr .hd small{display:block;font-size:9.5px;font-weight:400;opacity:.6}
.planet{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--p1),var(--p2));position:relative;flex:none}
.planet.ring::after{content:"";position:absolute;inset:10px -7px;border:2px solid #E9D3A5;border-radius:50%;transform:rotate(-18deg)}
.msg{position:relative;max-width:86%;font-size:11px;line-height:1.5;padding:7px 10px;border-radius:14px;opacity:0;transform:translateY(10px)}
.scr.on .msg{animation:up .5s var(--ease) forwards}
.msg.k{align-self:flex-end;background:#9FB7FF;color:#0B0F26;border-bottom-right-radius:4px}
.msg.p{background:rgba(255,255,255,.1);border-bottom-left-radius:4px}
.scr.on .msg:nth-of-type(3){animation-delay:.3s}.scr.on .msg:nth-of-type(4){animation-delay:.9s}.scr.on .msg:nth-of-type(5){animation-delay:1.7s}.scr.on .msg:nth-of-type(6){animation-delay:2.3s}
@keyframes up{to{transform:none;opacity:1}}
.inbar{position:relative;margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 6px 6px 12px;font-size:10.5px;color:rgba(232,236,255,.55)}
.inbar b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#9FB7FF;color:#0B0F26;font-size:12px}
.ptabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.ptabs button{position:relative;border:0;background:transparent;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);overflow:hidden;transition:color .3s}
.ptabs button.on{color:var(--ink);background:var(--tint)}
.ptabs .bar{position:absolute;left:9px;right:9px;bottom:2px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.ptabs .bar i{position:absolute;inset:0;background:var(--terra);transform:scaleX(0);transform-origin:left}
.ptabs button.on .bar i{animation:fill 5.2s linear forwards}
.stage.paused .ptabs button.on .bar i{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.phcap{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}

/* marquee */
.marq{position:relative;background:var(--teal);color:var(--on-teal);transform:rotate(-1.6deg);margin-block:24px 40px;margin-inline:-20px;overflow:hidden;padding-block:11px;direction:ltr}
.marq .track{display:flex;gap:28px;width:max-content;animation:marq 34s linear infinite;font-family:var(--f-display);font-size:18px;font-weight:500}
.marq .track span{display:flex;align-items:center;gap:28px;white-space:nowrap}
.marq .track span::after{content:"✦";color:var(--terra-2);font-size:13px}
.marq:hover .track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}

/* sections */
.sec{padding-block:56px}
.shead{margin-bottom:26px}
.kick{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;color:var(--terra);display:flex;align-items:center;gap:9px;margin-bottom:8px}
.kick::before{content:"";width:22px;height:1.5px;background:currentColor}
.shead h2{font-size:clamp(24px,3.2vw,38px);font-weight:600;letter-spacing:-.01em}
.split .ch{display:inline-block;opacity:0;transform:translateY(.5em) rotate(4deg);transition:transform .7s var(--ease),opacity .7s}
.split.in .ch{opacity:1;transform:none}

/* about bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;overflow:hidden;transition:transform .5s var(--ease),border-color .4s,box-shadow .5s}
.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--teal) 45%,var(--line));box-shadow:var(--shadow)}
.tile.big{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;gap:16px;padding:22px}
.tile.big p{font-size:15.5px;line-height:1.85;max-width:60ch}
.sig{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--teal)}
.fact{display:flex;flex-direction:column;gap:6px}
.fact .fic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--tint);color:var(--teal);margin-bottom:4px;transition:transform .5s var(--spring)}
.fact:hover .fic{transform:rotate(-10deg) scale(1.08)}
.fact .fl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--terra);text-transform:uppercase}
.fact b{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.45}
.fact span.s{font-size:13px;color:var(--muted)}
.tile.teal{background:var(--teal);color:var(--on-teal);border-color:transparent}
.tile.teal .fic{background:rgba(255,255,255,.14);color:var(--on-teal)}
.tile.teal .fl{color:var(--terra-2)}
.tile.teal span.s{color:var(--on-teal);opacity:.8}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,1fr)}.tile.big{grid-row:auto}}
@media (max-width:460px){.bento{grid-template-columns:1fr}.tile.big{grid-column:auto}}

/* hub tabs */
.tabs{position:relative;display:flex;gap:3px;padding:5px;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;overflow-x:auto;scrollbar-width:none;max-width:100%;width:max-content}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;border:0;background:transparent;cursor:pointer;padding:9px 16px;border-radius:12px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .35s}
.tab[aria-selected="true"]{color:var(--on-teal)}
.tabind{position:absolute;top:5px;bottom:5px;left:0;border-radius:12px;background:var(--teal);box-shadow:0 8px 18px -10px var(--teal);transition:transform .5s var(--ease),width .5s var(--ease)}
.panels{position:relative;margin-top:22px}
.panel{display:none}
.panel.on{display:block;animation:pin .6s var(--ease)}
.panel.on.back{animation-name:pinb}
@keyframes pin{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes pinb{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
[dir="rtl"] .panel.on{animation-name:pinb}
[dir="rtl"] .panel.on.back{animation-name:pin}

.fbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.fchip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted);transition:all .35s var(--ease);display:inline-flex;gap:7px;align-items:center}
.fchip em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;opacity:.7}
.fchip:hover{color:var(--ink);transform:translateY(-2px)}
.fchip[aria-pressed="true"]{background:var(--terra);color:#fff;border-color:var(--terra)}

/* project cards (one template) */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.card{position:relative;display:flex;flex-direction:column;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .4s var(--ease),box-shadow .4s,border-color .4s}
.card:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--teal) 40%,var(--line))}
.card.hide{display:none}
.card .glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(360px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.2),transparent 45%);opacity:0;transition:opacity .4s;z-index:2}
.card:hover .glare{opacity:1}
.cover{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--bg-2)}
.cover img,.cover svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease);direction:ltr}
.cover img.top{object-position:top}
.card:hover .cover img,.card:hover .cover svg{transform:scale(1.05)}
.cv-bob{animation:bob2 5s ease-in-out infinite}@keyframes bob2{50%{transform:translateY(-4px)}}
.award{position:absolute;top:10px;inset-inline-start:10px;z-index:1;font-size:11px;font-weight:600;background:var(--terra);color:#fff;padding:3px 10px;border-radius:999px;box-shadow:0 6px 14px -8px rgba(0,0,0,.5);max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .body{padding:14px 16px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{font-size:17px;font-weight:600}
.card .sd{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3.1em;line-height:1.6}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pills span{font-family:var(--f-mono);unicode-bidi:isolate;font-size:10.5px;background:var(--tint);color:var(--teal-2);padding:2px 8px;border-radius:6px;direction:ltr}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.cfoot .dt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cfoot .acts2{display:flex;align-items:center;gap:5px}
.lic{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:transparent;cursor:pointer;text-decoration:none;transition:all .3s var(--ease)}
.lic:hover{color:var(--on-teal);background:var(--teal);border-color:var(--teal);transform:translateY(-2px)}
.lic svg{width:14px;height:14px}
.det{font-size:12.5px;font-weight:600;color:var(--teal);display:inline-flex;align-items:center;gap:5px;padding-inline-start:4px}
.det svg{width:14px;height:14px;transition:transform .35s var(--ease)}
.card:hover .det svg{transform:translateX(3px)}
[dir="rtl"] .det svg{transform:scaleX(-1)}
[dir="rtl"] .card:hover .det svg{transform:scaleX(-1) translateX(3px)}

/* skills */
.skl{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:start}
@media (max-width:860px){.skl{grid-template-columns:1fr}}
.sgroup{margin-bottom:18px}
.sgroup h4{font-size:13.5px;color:var(--muted);font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sgroup h4 i{width:7px;height:7px;border-radius:2px;background:var(--terra)}
.spills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:12px;font-size:13.5px;cursor:pointer;transition:all .35s var(--ease)}
.pill:hover{transform:translateY(-2px);border-color:var(--teal)}
.pill[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:var(--teal);transform:translateY(-2px)}
.used{position:sticky;top:90px;background:var(--teal);color:var(--on-teal);border-radius:20px;padding:20px;min-height:200px;overflow:hidden}
.used h4{font-size:20px;font-weight:600;margin-bottom:4px}
.used .hint{opacity:.75;font-size:13px}
.used .desc{margin-top:10px;font-size:14px;line-height:1.75;opacity:.92;animation:up .45s var(--ease) both}
#usedL li{list-style:none;margin-top:7px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);padding:8px 11px;border-radius:11px;opacity:0;transform:translateY(10px);animation:up .45s var(--ease) forwards;cursor:pointer;font-size:13.5px}
#usedL li:hover{background:rgba(255,255,255,.18)}
#usedL li img{width:26px;height:26px;border-radius:7px;object-fit:cover;object-position:top}
.used .ring{position:absolute;width:200px;height:200px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.25);bottom:-90px;inset-inline-end:-70px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* achievement */
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:stretch}
@media (max-width:760px){.achs{grid-template-columns:1fr}}
.ach{position:relative;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:linear-gradient(150deg,var(--teal),color-mix(in srgb,var(--teal) 72%,#000));color:var(--on-teal);cursor:pointer;transition:transform .45s var(--ease),box-shadow .45s}
.ach:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.ach .img{position:relative;aspect-ratio:16/8;overflow:hidden}
.ach .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.ach:hover .img img{transform:scale(1.05)}
.ach .in{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
.ach .ahead{display:flex;justify-content:space-between;align-items:center}
.ach .medal{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#F2C98A;transition:transform .5s var(--spring)}
.ach:hover .medal{transform:rotate(-12deg) scale(1.1)}
.ach .medal svg{width:19px;height:19px}
.ach h3{font-size:18px}
.ach .dt{font-family:var(--f-mono);font-size:11.5px;opacity:.75}
.ach p{font-size:13.5px;opacity:.88;line-height:1.8}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stats span{font-size:12px;font-weight:500;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:3px 10px;border-radius:999px}
.stats b{font-family:var(--f-display);color:#F2C98A;margin-inline-end:4px}
.ach .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.ach .btn{padding:8px 13px;font-size:12.5px}
.ach .btn.l{background:var(--on-teal);color:var(--teal)}
.ach .btn.o{border-color:rgba(255,255,255,.35);color:var(--on-teal)}
.ach .btn.o:hover{background:rgba(255,255,255,.12)}
.tapn{font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center}
/* certificates */
.certs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.certs{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.certs{grid-template-columns:1fr}}
.cert{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .45s var(--ease),box-shadow .45s,border-color .4s}
.cert:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--terra) 40%,var(--line))}
.cph{position:relative;height:96px;display:flex;align-items:center;gap:12px;padding:0 16px;background:linear-gradient(135deg,var(--tint),var(--bg-2));overflow:hidden;border-bottom:1px solid var(--line)}
.cph::before{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);border-radius:10px}
.cph::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--terra) 45%,transparent);inset-inline-end:-30px;top:-30px;transition:transform 1.2s var(--ease)}
.cert:hover .cph::after{transform:rotate(90deg) scale(1.1)}
.cph svg{width:34px;height:34px;stroke-width:1.2;color:var(--teal);position:relative}
.cph .iss{position:relative;font-family:var(--f-display);font-size:13px;font-weight:500;color:var(--teal-2);line-height:1.4}
.cert .cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cert .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--terra-soft);color:var(--terra)}
.cert .dt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cert h4{font-size:15px;font-weight:600;line-height:1.4}
.cert p{font-size:13px;color:var(--muted);line-height:1.7}

/* volunteering */
.vols{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:760px){.vols{grid-template-columns:1fr}}
.vol{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:14px;transition:transform .45s var(--ease),box-shadow .45s,border-color .4s}
.vol:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--teal) 40%,var(--line))}
.vol .vic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--tint);color:var(--teal);flex:none;transition:transform .5s var(--spring)}
.vol:hover .vic{transform:rotate(-10deg)}
.vol .vt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.vol .dt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cur-b{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--terra);color:#fff;display:inline-flex;align-items:center;gap:5px}
.cur-b::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;animation:ping2 1.6s infinite}
@keyframes ping2{50%{opacity:.3}}
.vol h4{font-size:15.5px;font-weight:600;margin-top:3px}
.vol .org{font-size:13px;color:var(--teal-2);font-weight:500}
.vol p{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.7}
.vol .note{font-size:12px;color:var(--muted);opacity:.85;margin-top:4px}

/* contact */
.contact{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:14px}
@media (max-width:700px){.contact{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}}
.ccard{position:relative;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;text-decoration:none;overflow:hidden;transition:transform .45s var(--ease),border-color .4s,box-shadow .45s}
.ccard:hover{transform:translateY(-4px);border-color:var(--teal);box-shadow:var(--shadow)}
.ccard .cic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--teal);color:var(--on-teal);flex:none;transition:transform .5s var(--spring)}
.ccard:hover .cic{transform:rotate(-10deg) scale(1.06)}
.ccard .cl{font-family:var(--f-mono);font-size:11px;color:var(--terra);letter-spacing:.08em}
.ccard .cv{font-size:14px;font-weight:500;direction:ltr;unicode-bidi:isolate;text-align:start;overflow-wrap:anywhere;user-select:all}
.ccard .copy{margin-inline-start:auto;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;cursor:pointer;flex:none}
.ccard .copy:hover{border-color:var(--terra);color:var(--terra)}
.ccard .copy.ok{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.ccard a.cic{text-decoration:none}
.ccard .clink{display:block;color:inherit;text-decoration:none;transition:color .25s}
.ccard .clink:hover{color:var(--terra);text-decoration:underline;text-underline-offset:3px}

/* outro */
.outro{position:relative;padding-block:60px 30px;overflow:hidden;text-align:center}
.big-marq{direction:ltr;overflow:hidden;white-space:nowrap}
html[lang="ar"] .big-marq div{line-height:1.45;font-family:var(--f-body)}
.big-marq div{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,64px);line-height:1;letter-spacing:-.03em;animation:marq 26s linear infinite;color:transparent;-webkit-text-stroke:1.4px var(--teal)}
.big-marq div b{color:var(--teal);-webkit-text-stroke:0}
.outro .cta{justify-content:center}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}

/* modal (one template) */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:14px;visibility:hidden}
.modal .scrim{position:absolute;inset:0;background:rgba(6,18,17,.6);backdrop-filter:blur(6px);opacity:0;transition:opacity .45s}
.modal.open{visibility:visible}
.modal.open .scrim{opacity:1}
.sheet{position:relative;background:var(--surface);border-radius:24px;width:min(820px,100%);max-height:92vh;overflow:auto;opacity:0;transform:translateY(40px) scale(.96);transition:transform .55s var(--ease),opacity .4s;overscroll-behavior:contain}
.modal.open .sheet{opacity:1;transform:none}
.sheet .cover{aspect-ratio:16/7}
.x{position:sticky;top:12px;float:right;margin:12px 12px -52px 0;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#132C29;cursor:pointer;display:grid;place-items:center;transition:transform .4s var(--spring);box-shadow:0 4px 14px rgba(0,0,0,.2)}
[dir="rtl"] .x{float:left;margin:12px 0 -52px 12px}
.x:hover{transform:rotate(90deg)}
.mbody{padding:22px 26px 26px;display:grid;gap:18px}
.mbody.swap{animation:up .45s var(--ease) both}
.mh h3{font-size:clamp(22px,3vw,30px)}
.tagline{font-style:italic;color:var(--terra);font-family:var(--f-display);font-size:15px;margin-top:2px}
.mh .award{position:static;display:inline-block;margin-top:10px;white-space:normal}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.meta svg{width:13px;height:13px}
.lbar{display:flex;flex-wrap:wrap;gap:8px}
.lbar .btn{padding:9px 15px;font-size:13px}
.blk h5{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--terra);margin:0 0 6px;font-weight:500;text-transform:uppercase}
.blk p{font-size:14.5px;line-height:1.85;color:var(--ink)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.two2{grid-template-columns:1fr}}
.box2{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box2.pb{border-inline-start:3px solid var(--terra)}
.box2.sb{border-inline-start:3px solid var(--teal)}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feats li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.7}
.feats li .ck{width:18px;height:18px;border-radius:6px;background:var(--tint);color:var(--teal);display:grid;place-items:center;flex:none;margin-top:3px}
.feats li .ck svg{width:11px;height:11px;stroke-width:3}
.team{display:flex;flex-wrap:wrap;gap:6px}
.team span{font-size:13px;padding:4px 11px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line)}
.team span.me{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gal button{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;cursor:zoom-in;background:var(--bg-2)}
.gal img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s var(--ease)}
.gal button:hover img{transform:scale(1.08)}
.gal .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,75,72,.72);color:#fff;font-family:var(--f-display);font-weight:600;font-size:18px}
.pn{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.pn button{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 14px;cursor:pointer;text-align:start;transition:all .3s var(--ease);max-width:48%}
.pn button:hover{border-color:var(--teal);transform:translateY(-2px)}
.pn button small{font-size:11px;color:var(--muted)}
.pn button b{font-family:var(--f-display);font-size:14px;font-weight:600}
.pn button.nx{margin-inline-start:auto;text-align:end}
::view-transition-old(pcover),::view-transition-new(pcover){animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.8,.2,1);height:100%;object-fit:cover}

/* lightbox */
.lb{position:fixed;inset:0;z-index:85;background:rgba(5,12,11,.94);display:grid;grid-template-rows:auto 1fr auto;visibility:hidden;opacity:0;transition:opacity .35s,visibility .35s}
.lb.open{visibility:visible;opacity:1}
.lbtop{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;color:#fff;font-family:var(--f-mono);font-size:12px}
.lbtop button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}
.lbstage{position:relative;display:grid;place-items:center;padding:0 60px;min-height:0;overflow:hidden}
.lbstage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:lbin .45s var(--ease)}
@keyframes lbin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.lbnav{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .3s}
.lbnav:hover{background:var(--terra)}
.lbnav.p{left:10px}.lbnav.n{right:10px}
.lbthumbs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 16px;justify-content:center;scrollbar-width:thin;direction:ltr}
.lbthumbs button{flex:none;width:64px;height:40px;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;opacity:.5;transition:all .3s}
.lbthumbs button.on{border-color:var(--terra-2);opacity:1}
.lbthumbs img{width:100%;height:100%;object-fit:cover;object-position:top}
@media (max-width:600px){.lbstage{padding:0 8px}.lbnav{display:none}}

html[lang="ar"] .fl,html[lang="ar"] .blk h5,html[lang="ar"] .cfoot .dt,html[lang="ar"] .vol .dt,html[lang="ar"] .cert .dt,html[lang="ar"] .ach .dt,html[lang="ar"] .ach2 .dt,html[lang="ar"] .kick,html[lang="ar"] .htitle,html[lang="ar"] .ccard .cl,html[lang="ar"] .ach .tap,html[lang="ar"] .phcap{letter-spacing:0;font-family:var(--f-body)}
html[lang="ar"] .blk h5{font-size:12.5px;font-weight:600}
.lb{direction:ltr}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.rv{transition:transform .9s var(--ease),opacity .9s var(--ease)}
.rv.pre{transform:translateY(24px);opacity:.001}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.curtain{display:none}.rv.pre{opacity:1;transform:none}.split .ch{opacity:1;transform:none}}
</style>
</head>
<body>


<div class="curtain" id="curtain" aria-hidden="true"><span data-t="brand_short"></span><i></i></div>
<div class="progress" id="progress"></div>
<div class="cur" id="cur"></div><div class="cur-ring" id="curRing"></div>
<canvas id="confetti"></canvas>

<nav class="nav" id="nav">
  <div class="navin">
    <a class="logo" href="#top" aria-label="Top" data-t="logo">ف</a>
    <div class="navlinks" id="navlinks">
      <span class="navpill" id="navpill"></span>
      <a href="#about" data-t="nav_about"></a>
      <a href="#work" data-tab="projects" data-t="nav_projects"></a>
      <a href="#work" data-tab="skills" data-t="nav_skills"></a>
      <a href="#work" data-tab="ach" data-t="nav_ach"></a>
      <a href="#work" data-tab="certs" data-t="nav_certs"></a>
      <a href="#work" data-tab="vol" data-t="nav_vol"></a>
      <a href="#contact" data-t="nav_contact"></a>
    </div>
    <button class="ibtn" id="themeBtn" type="button" aria-label="Theme"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ibtn txt" id="langBtn" type="button" aria-label="Language">EN</button>
  </div>
</nav>

<header class="hero" id="top">
  <canvas id="dots" aria-hidden="true"></canvas>
  <div class="blob a"></div><div class="blob b"></div>
  <div class="wrap">
    <div>
      <h1 id="heroName"></h1>
      <div class="htitle" data-t="title"></div>
      <div class="rot"><span class="lbl" data-t="rot_lbl"></span><span class="rotbox" id="rotbox"></span></div>
      <p class="lead" data-t="intro"></p>
      <div class="cta">
        <a class="btn primary mag" href="#work"><span data-t="cta_projects"></span><svg class="i arr" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a class="btn outline mag" href="#contact" data-t="cta_contact"></a>
      </div>
    </div>
  </div>
</header>

<div class="marq" aria-hidden="true"><div class="track" id="marq"></div></div>

<main>
<section class="sec" id="about">
  <div class="wrap">
    <div class="shead"><div class="kick" data-t="k1"></div><h2 class="split" data-t="about_title"></h2></div>
    <div class="bento" id="bento"></div>
  </div>
</section>

<section class="sec" id="work">
  <div class="wrap">
    <div class="shead"><div class="kick" data-t="k2"></div><h2 class="split" data-t="work_title"></h2></div>
    <div class="tabs" id="tabs" role="tablist"><span class="tabind" id="tabind"></span></div>
    <div class="panels">
      <div class="panel on" data-panel="projects" role="tabpanel"><div class="fbar" id="fbar"></div><div class="grid" id="grid"></div></div>
      <div class="panel" data-panel="skills" role="tabpanel">
        <div class="skl"><div id="skills"></div>

  overview:{ar:"«فلو باي» محفظة رقمية مشتركة صُمّمت للعائلات وفرق العمل؛ إذ يُشحن فيها رصيد مركزي واحد، ثم يُوزَّع على بطاقات فردية لكل عضو وفق ميزانيات محددة لكل قطاع، كالمطاعم والتموينات ومحطات الوقود. ويمنح التطبيق مسؤولَ المحفظة رؤية لحظية لكل عملية، وصلاحية ضبط حدود الإنفاق وأوقاته وأماكنه، ليصبح الصرف المشترك منظّمًا وشفافًا.",en:"Flow Pay is a shared digital wallet designed for families and teams: one central balance is topped up, then distributed to individual member cards according to per-sector budgets such as restaurants, groceries, and fuel. The admin gets a real-time view of every transaction and can set spending limits, times, and places, making shared spending organized and transparent."},
  problem:{ar:"يفتقر الإنفاق المشترك داخل الأسرة أو فريق العمل غالبًا إلى الشفافية؛ فلا فواتير تفصيلية ولا تقارير دقيقة، ويصعب تتبّع مشتريات الأبناء أو السائقين أو الموظفين، في ظل غياب ميزانية واضحة لكل قطاع، مما يفتح الباب للإسراف وسوء الاستخدام.",en:"Shared spending in families and teams often lacks transparency: no detailed invoices or accurate reports, purchases by children, drivers, or employees are hard to track, and there is no clear budget per sector, which opens the door to overspending and misuse."},
  solution:{ar:"رصيد مركزي تتفرّع منه بطاقات فردية، وميزانيات تُوزَّع تلقائيًا على القطاعات، وتحكّم لحظي يتيح للمسؤول الموافقة على العمليات أو تقييدها أو تحديد سقف الإنفاق لكل عضو، مع فواتير إلكترونية وتحليلات تكشف أين يذهب كل ريال.",en:"A central balance that branches into individual cards, budgets distributed automatically across sectors, and real-time control that lets the admin approve, restrict, or cap each member's spending, with e-invoices and analytics that show where every riyal goes."},
  features:{ar:["محفظة مركزية ببطاقات فردية تشترك في رصيد واحد", "ميزانيات حسب القطاع مع توزيع تلقائي", "صلاحيات دفع مباشرة أو مشروطة بالموافقة، مع قيود زمنية ومكانية", "فواتير إلكترونية تفصيلية تصل إلى مسؤول المحفظة", "رصيد احتياطي للطوارئ لكل عضو", "تحليلات للإنفاق حسب القطاع والعضو والمتجر", "التسجيل عبر نفاذ، والشحن عبر Apple Pay ومدى"],en:["Central wallet with individual member cards sharing one balance","Sector-based budgets with auto-distribution","Payment permissions: direct or approval-required, with time and location limits","Detailed e-invoices sent to the wallet admin","Emergency reserve balance per member","Spending analytics by sector, member, and store","Nafath sign-up; top-up via Apple Pay and mada"]},

  role:{ar:"عضوة في الفريق: شاركتُ في بلورة الفكرة وتصميم التطبيق ونموذج العمل، وفي عرض المشروع على مسرح Money20/20 Middle East.",en:"Team member: co-developed the concept, app design, and business model, and pitched on stage at Money20/20 Middle East."},

  title:{ar:"بصيرة",en:"Basirah"},tagline:{ar:"رؤية واضحة، رعاية ذكية.",en:"Clear Vision, Smart Care."},
  short:{ar:"تطبيق للعناية بصحة العين، يساعد المستخدم على متابعة نظره والمحافظة على عادات صحية بين زيارات العيادة.",en:"An eye-care app that helps people track their vision and keep healthy eye habits between clinic visits."},
  overview:{ar:"مشروع جماعي في تصميم تجربة المستخدم وتطوير التطبيقات. يساعد «بصيرة» المستخدمَ على فحص نظره من المنزل، ومتابعة نتائجه بمرور الوقت، واستشارة طبيب مختص، وبناء عادات يومية للعناية بعينيه.",en:"A UI/UX and app development team project. Basirah helps users test their vision at home, track results over time, consult a doctor, and build daily eye-care habits."},
  problem:{ar:"تحتاج صحة العين إلى عادات يومية وفحوصات منتظمة، غير أن كثيرًا من الناس يفقدون المتابعة بين الزيارات؛ إذ يصعب عليهم الالتزام، ويفتقرون إلى سجل منظّم للنظر والأدوية، وينسون مواعيدهم، فيتأخر اكتشاف التغيّرات التدريجية في النظر.",en:"Good eye health needs daily habits and regular check-ups, yet many people lose track between clinic visits: habits are hard to keep, there's no organized record of vision or medication, appointments are forgotten, and gradual vision changes are detected late."},
  solution:{ar:"تطبيق واحد يجمع فحص النظر المنزلي، وسجلّ النظر، والاستشارة الطبية، والتذكيرات اليومية، ليبقى المستخدم على اطلاع دائم بصحة عينيه بين الزيارات.",en:"One app that combines at-home vision testing, a vision history record, doctor consultations, and daily reminders, so users stay on top of their eye health between visits."},
  features:{ar:["فحص منزلي للنظر بتعليمات واضحة ونتائج فورية", "سجل للنظر برسم بياني عبر الزمن، مع نصائح للمشكلات الشائعة", "استشارة طبية: وصف الأعراض، ومحادثة الطبيب، والحصول على ملخص للحالة", "عناية يومية: تذكيرات مخصّصة، ومتابعة القطرات، وتاريخ انتهاء العدسات، وتمارين موجّهة للعين", "خيارات لتسهيل الوصول وتخصيص التجربة"],en:["At-home vision test with guided instructions and instant results","Vision history charted over time, plus tips for common eye problems","Eye consultation: describe symptoms, chat with a doctor, get a care summary","Daily eye care: custom reminders, eye-drop tracker, lens-expiry tracking, guided eye exercises","Accessibility and customization options"]},

  title:{ar:"لا تيبل",en:"La Table"},tagline:{ar:"تفضّل بالجلوس، فالشيف الصغير في انتظارك.",en:"Pull up a chair — the little chef has been expecting you."},
  short:{ar:"تطبيق يعرّف بالمطبخ الفرنسي بهوية بصرية دافئة وشخصية شيف أصلية، مبني بـ Flutter.",en:"A Flutter app that introduces French cuisine with a warm identity and an original chef mascot."},
  overview:{ar:"مشروع فردي مبني بـ Flutter، يصحب المستخدم في جولة داخل المطبخ الفرنسي؛ إذ يتيح له تصفّح الأطباق، والاطلاع على مكوّناتها بالتفصيل، وحفظ ما يفضّله منها. صمّمتُ له هوية بصرية دافئة بألوان ورقية ولمسات من الأحمر الكرزي، مع شخصية فأر شيف أصلية ترافق المستخدم منذ الشاشة الأولى، وحركات تفاعلية تمنح التطبيق طابعه الخاص. وتُستمد بيانات الأطباق من TheMealDB API. وقد حصل المشروع على المركز الأول في تقييم مشاريع معسكر Flutter المقدَّم من أكاديمية طويق.",en:"A solo Flutter project that takes you on a tour of French cuisine: browse dishes, explore their ingredients in detail, and save your favorites. I designed a warm visual identity with paper tones and cherry-red accents, an original mouse-chef mascot that welcomes users from the first screen, and playful animations that give the app its own personality. Dish data comes from TheMealDB API. The project won first place in the project evaluation of the Flutter bootcamp presented by Tuwaiq Academy."},
  problem:{ar:"تتشابه أغلب تطبيقات الوصفات في قوائمها العامة وتصاميمها الجامدة التي لا تعكس دفء المطبخ الذي تعرضه ولا شخصيته.",en:"Most recipe apps look the same: generic lists and cold layouts that don't reflect the warmth and character of the cuisine they show."},
  solution:{ar:"تجربة ذات طابع خاص تنقل المستخدم إلى أجواء المطعم الباريسي، وتجمع بين بيانات حيّة من واجهة برمجية، ونظام تصميم مميّز مرسوم يدويًا، وحركات تفاعلية ممتعة.",en:"A themed experience that feels like sitting in a Paris bistro, pairing live API data with a distinctive hand-crafted design system and playful animations."},
  features:{ar:["شاشة افتتاحية متحركة متعددة المراحل مع شخصية الشيف", "انتقال سلس من قائمة الأطباق إلى تفاصيل الطبق ومكوّناته", "قائمة للأطباق المفضّلة", "تصميم مخصّص لحالات التحميل والخطأ والصفحات الفارغة", "نظام موحّد لعناصر التصميم ومكتبة مكوّنات قابلة لإعادة الاستخدام"],en:["Animated multi-stage splash with a tap-to-continue chef character","Menu → dish details flow with ingredients","Favorites list","Branded loading, error, and empty states","Unified design-token system and a reusable widget library"]},
  tech:["Flutter","Dart","REST API (TheMealDB)"],skills:["flutter","dart","uiux"],
  role:{ar:"مشروع فردي: التصميم والبرمجة. وقد حصل على المركز الأول في تقييم مشاريع معسكر Flutter المقدَّم من أكاديمية طويق.",en:"Solo project: design and development. Placed 1st in the Tuwaiq Academy Flutter bootcamp evaluation."},members:[],
  links:[{k:"github",l:{ar:"GitHub",en:"GitHub"},u:"https://github.com/Engfatiimah/Fatimah_project2"}],

function applyFilter(anim){
 const cards=$$(".card");
 const first=new Map(cards.filter(c=>!c.classList.contains("hide")).map(c=>[c,c.getBoundingClientRect()]));

 cards.filter(c=>!c.classList.contains("hide")).forEach((c,i)=>{
  const b=c.getBoundingClientRect(),a=first.get(c);
  if(a)c.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px)`},{transform:"none"}],{duration:600,easing:"cubic-bezier(.2,.8,.2,1)"});

function bindTilt(){

 });
}

 const i=PROJECTS.findIndex(x=>x.id===id);lastFocus=document.activeElement;openCard=card;
 const go=()=>{fillModal(i);$("#sheet").scrollTop=0;$("#modal").classList.add("open");$("#modal").setAttribute("aria-hidden","false");document.body.style.overflow="hidden";};
 if(card&&document.startViewTransition&&!reduce){
  const cov=card.querySelector(".cover");cov.style.viewTransitionName="pcover";
  const t=document.startViewTransition(()=>{cov.style.viewTransitionName="";$("#mCover").style.viewTransitionName="pcover";go();});
  t.finished.finally(()=>{$("#mCover").style.viewTransitionName="";});
 }else go();
 setTimeout(()=>$("#mClose").focus({preventScroll:true}),60);
}
function closeModal(){
 if(!$("#modal").classList.contains("open"))return;
 const done=()=>{$("#modal").classList.remove("open");$("#modal").setAttribute("aria-hidden","true");document.body.style.overflow="";};
 const card=$(`.card[data-id="${PROJECTS[curP].id}"]`);
 if(card&&!card.classList.contains("hide")&&document.startViewTransition&&!reduce&&inView(card)){
  const cov=card.querySelector(".cover");$("#mCover").style.viewTransitionName="pcover";
  const t=document.startViewTransition(()=>{$("#mCover").style.viewTransitionName="";cov.style.viewTransitionName="pcover";done();});
  t.finished.finally(()=>{cov.style.viewTransitionName="";});
 }else done();
 if(lastFocus)lastFocus.focus({preventScroll:true});
}
$("#mClose").onclick=closeModal;$("#scrim").onclick=closeModal;

/* lightbox */
let lbSet=[],lbI=0;
function openLB(set,i){
 lbSet=set;lbI=i;$("#lbThumbs").innerHTML=set.length>1?set.map((k,j)=>`<button type="button" data-j="${j}">${img(k)}</button>`).join(""):"";
 $$("#lbThumbs button").forEach(b=>b.onclick=()=>showLB(+b.dataset.j));
 $("#lbPrev").hidden=$("#lbNext").hidden=set.length<2;
 $("#lb").classList.add("open");$("#lb").setAttribute("aria-hidden","false");showLB(i);document.body.style.overflow="hidden";
}
function showLB(i){
 lbI=(i+lbSet.length)%lbSet.length;const im=$("#lbImg");im.style.animation="none";im.offsetWidth;im.style.animation="";im.src=IMG[lbSet[lbI]];
 $("#lbCount").textContent=`${lbI+1} / ${lbSet.length}`;
 $$("#lbThumbs button").forEach((b,j)=>b.classList.toggle("on",j===lbI));
 const on=$("#lbThumbs .on");on&&on.scrollIntoView({block:"nearest",inline:"center",behavior:reduce?"auto":"smooth"});
}
function closeLB(){$("#lb").classList.remove("open");$("#lb").setAttribute("aria-hidden","true");if(!$("#modal").classList.contains("open"))document.body.style.overflow="";}
$("#lbClose").onclick=closeLB;$("#lbPrev").onclick=()=>showLB(lbI-1);$("#lbNext").onclick=()=>showLB(lbI+1);
$("#lbStage").addEventListener("click",e=>{if(e.target.id==="lbStage")closeLB()});
let tx=null;$("#lbStage").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
$("#lbStage").addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)showLB(lbI+(dx<0?1:-1));tx=null});
addEventListener("keydown",e=>{
 if($("#lb").classList.contains("open")){if(e.key==="Escape")closeLB();if(e.key==="ArrowRight")showLB(lbI+1);if(e.key==="ArrowLeft")showLB(lbI-1);return;}
 if(e.key==="Escape")closeModal();
});

/* confetti */
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],confRun=false;
function confetti(x,y){
 if(reduce)return;cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 const cols=["#0E4B48","#C25E36","#F2B880","#58B2A6","#E08157","#F6F1E8"];
 for(let i=0;i<110;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*6+4,c:cols[i%cols.length],rot:Math.random()*6,vr:Math.random()*.3-.15,life:1});}
 if(!confRun){confRun=true;requestAnimationFrame(tickC)}
}
function tickC(){
 cx.clearRect(0,0,innerWidth,innerHeight);
 parts.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.008;cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
 parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
 if(parts.length)requestAnimationFrame(tickC);else{confRun=false;cx.clearRect(0,0,innerWidth,innerHeight)}
}

/* hero dots */
const dc=$("#dots"),dctx=dc.getContext("2d");let mx=-999,my=-999,dotsOn=true,DW=0,DH=0;
function sizeDots(){const r=dc.getBoundingClientRect();DW=r.width;DH=r.height;dc.width=DW*devicePixelRatio;dc.height=DH*devicePixelRatio;dctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
function drawDots(){
 if(!dotsOn)return;
 const cs=getComputedStyle(document.documentElement),c1=cs.getPropertyValue("--line").trim(),c2=cs.getPropertyValue("--terra").trim();
 dctx.clearRect(0,0,DW,DH);const g=26;
 for(let y=g/2;y<DH;y+=g)for(let x=g/2;x<DW;x+=g){const dd=Math.hypot(x-mx,y-my),k=Math.max(0,1-dd/150);
  dctx.beginPath();dctx.fillStyle=k>0.05?c2:c1;dctx.globalAlpha=k>0.05?.25+k*.75:.9;dctx.arc(x+(x-mx)*k*.12,y+(y-my)*k*.12,1.1+k*2.2,0,7);dctx.fill();}
 dctx.globalAlpha=1;if(!reduce)requestAnimationFrame(drawDots);
}
$(".hero").addEventListener("pointermove",e=>{const r=dc.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
$(".hero").addEventListener("pointerleave",()=>{mx=my=-999});
new IntersectionObserver(es=>{const was=dotsOn;dotsOn=es[0].isIntersecting;if(dotsOn&&!was)drawDots();}).observe($(".hero"));
addEventListener("resize",()=>{sizeDots();if(reduce)drawDots();moveInd($("#tabind"),$(`.tab[data-tab="${curTab}"]`));updateNav();});

/* cursor + magnetic */
const cur=$("#cur"),ring=$("#curRing");let cxp=0,cyp=0,rxp=0,ryp=0;
if(fine&&!reduce){
 addEventListener("pointermove",e=>{if(!document.body.classList.contains("has-cur")){document.body.classList.add("has-cur");rxp=e.clientX;ryp=e.clientY;}cxp=e.clientX;cyp=e.clientY;cur.style.transform=`translate(${cxp}px,${cyp}px)`;});
 (function loop(){rxp+=(cxp-rxp)*.18;ryp+=(cyp-ryp)*.18;ring.style.transform=`translate(${rxp}px,${ryp}px)`;requestAnimationFrame(loop)})();
}
function bindCursor(){
 if(!fine||reduce)return;
 $$("a,button,.card,.ach").forEach(el=>{if(el.dataset.cb)return;el.dataset.cb=1;el.addEventListener("pointerenter",()=>ring.classList.add("big"));el.addEventListener("pointerleave",()=>ring.classList.remove("big"));});
 $$(".mag").forEach(el=>{if(el.dataset.mg)return;el.dataset.mg=1;
  el.addEventListener("pointermove",e=>{const r=el.getBoundingClientRect();el.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.22}px,${(e.clientY-r.top-r.height/2)*.3}px)`});
  el.addEventListener("pointerleave",()=>el.style.transform="");});
}

/* nav */
let lastY=0;
function updateNav(){
 const links=$$("#navlinks a"),pill=$("#navpill");let act=null;
 const sec=id=>{const r=$(id).getBoundingClientRect();return r.top<innerHeight*.45&&r.bottom>120};
 if(sec("#contact"))act=links.find(a=>a.getAttribute("href")==="#contact");
 else if(sec("#work"))act=links.find(a=>a.dataset.tab===curTab);
 else if(sec("#about"))act=links[0];
 links.forEach(a=>a.classList.toggle("on",a===act));
 if(act&&act.offsetWidth){pill.style.opacity=1;pill.style.width=act.offsetWidth+"px";pill.style.transform=`translateX(${act.offsetLeft}px)`;}else pill.style.opacity=0;
}
addEventListener("scroll",()=>{
 const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
 $("#progress").style.transform=`scaleX(${h>0?y/h:0})`;
 $("#nav").classList.toggle("hide",y>lastY&&y>400);lastY=y;updateNav();
},{passive:true});

/* reveal */
const rvIO="IntersectionObserver" in window&&!reduce?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");rvIO.unobserve(e.target)}}),{rootMargin:"0px 0px -50px 0px"}):null;
function reveal(){if(!rvIO)return;$$(".rv").forEach((el,i)=>{if(el.dataset.rv)return;el.dataset.rv=1;if(!inView(el)){el.classList.add("pre");el.style.transitionDelay=(i%5)*70+"ms";rvIO.observe(el)}});}

/* toggles */
$("#langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("fp_lang",lang)}catch(e){}
 if(document.startViewTransition&&!reduce)document.startViewTransition(setLang);else setLang();};
$("#themeBtn").onclick=e=>{
 const root=document.documentElement,isDark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches,nt=isDark?"light":"dark";
 const apply=()=>{root.dataset.theme=nt;try{localStorage.setItem("fp_theme",nt)}catch(er){}if(reduce)drawDots();};
 if(document.startViewTransition&&!reduce){const x=e.clientX,y=e.clientY,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:650,easing:"cubic-bezier(.2,.8,.2,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{});
 }else apply();
};

/* in-page links: reliable smooth scroll */
document.addEventListener("click",e=>{
 const a=e.target.closest('a[href^="#"]');if(!a)return;
 const id=a.getAttribute("href").slice(1);e.preventDefault();
 const beh=reduce?"auto":"smooth";
 if(!id||id==="top"){window.scrollTo({top:0,behavior:beh});return;}
 const el=document.getElementById(id);if(!el)return;
 const y=el.getBoundingClientRect().top+window.scrollY-70;
 window.scrollTo({top:Math.max(0,y),behavior:beh});
});
/* boot */
setLang();sizeDots();drawDots();reveal();bindCursor();
setTimeout(()=>{document.body.dataset.ready=1;const c=$("#curtain");c&&c.remove()},reduce?0:1700);
</script>
